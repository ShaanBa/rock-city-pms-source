name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  public-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: ./scripts/check-public-readiness.sh

  package-quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            command: npm run typecheck
          - package: frontend
            command: npm run lint && npm run build
          - package: frontend-public
            command: npm run lint && npm run build
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_replace_me
      NEXT_PUBLIC_BOOKING_PAUSED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.command }}

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rockcity_pms_test
          POSTGRES_USER: pms_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pms_test -d rockcity_pms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pms_test:test-only-password@localhost:5432/rockcity_pms_test
      STAFF_API_KEY: ci-staff-api-key
      IMPORT_API_KEY: ci-import-api-key
      STRIPE_SECRET_KEY: stripe-test-placeholder
      PUBLIC_BOOKING_PAUSED: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm exec drizzle-kit migrate
        working-directory: backend
      - run: npm exec tsx src/db/run-seed.ts
        working-directory: backend
      - run: npm test
        working-directory: backend
