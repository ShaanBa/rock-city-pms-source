services:
  postgres:
    image: postgres:18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rockcity_pms_dev}
      POSTGRES_USER: ${POSTGRES_USER:-pms_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}